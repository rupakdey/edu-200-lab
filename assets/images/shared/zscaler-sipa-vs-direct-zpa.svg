<path d="M922 541 L931 546 L922 551 Z" fill="#b6c8df"/>
<path d="M238 496 L243 505 L248 496 Z" fill="#87b6ff"/>
<path d="M213 496 L218 505 L223 496 Z" fill="#6fdfbf"/>
<path d="M243 488 V497" fill="none" stroke="#87b6ff" stroke-width="2.5" stroke-linejoin="round"/>
<path d="M218 488 V497" fill="none" stroke="#6fdfbf" stroke-width="2.5" stroke-linejoin="round"/>
</g></svg>
