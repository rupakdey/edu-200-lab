<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1200" viewBox="0 0 1920 1200" role="img" aria-labelledby="title desc">
<title id="title">Zscaler Source IP Anchoring: regular ZIA and SIPA traffic flows</title><desc id="desc">Regular ZIA forwards inspected traffic from a Zscaler public egress IP. For selected applications, SIPA forwards inspected traffic through the ZPA service fabric, a customer-deployed App Connector, and the organization’s public NAT egress, so the destination sees the chosen organization-controlled public IP. The example application only allowlists that organization IP.</desc><defs>
<marker id="blue" viewBox="0 0 12 12" refX="12" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L12 6 L0 12Z" fill="#67b5ff"/></marker>
<marker id="green" viewBox="0 0 12 12" refX="12" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L12 6 L0 12Z" fill="#51e2b0"/></marker>
</defs><rect width="1920" height="1200" fill="#07182e"/><g font-family="Arial, Helvetica, sans-serif">
<text x="60" y="53" font-size="18" fill="#51e2b0" font-weight="700" text-anchor="start">ZSCALER INTERNET ACCESS  /  SOURCE IP ANCHORING</text>
<text x="60" y="111" font-size="43" fill="#f5f8ff" font-weight="700" text-anchor="start">Keep ZIA security. Choose the public egress IP.</text>
<text x="60" y="152" font-size="25" fill="#b2c4d9" font-weight="400" text-anchor="start">SIPA steers selected applications through your egress so their source-IP checks recognize your organization.</text>
<rect x="60" y="190" width="1800" height="72" rx="16" fill="#172b43" stroke="#29425e" stroke-width="1.5"/>
<text x="84" y="220" font-size="17" fill="#51e2b0" font-weight="700" text-anchor="start">WHY SIPA?</text>
<text x="230" y="220" font-size="22" fill="#f5f8ff" font-weight="400" text-anchor="start">Some SaaS, partner and internet services accept traffic only from approved corporate public IPs.</text>
<text x="230" y="246" font-size="20" fill="#b2c4d9" font-weight="400" text-anchor="start">Example throughout: the destination allowlists your organization’s 203.0.113.10 address.</text>
<text x="60" y="311" font-size="29" fill="#67b5ff" font-weight="700" text-anchor="start">01  Regular ZIA path</text>
<text x="440" y="310" font-size="21" fill="#b2c4d9" font-weight="400" text-anchor="start">Inspected traffic exits directly from Zscaler’s public service infrastructure.</text>
<rect x="60" y="350" width="220" height="136" rx="16" fill="#10253f" stroke="#29425e" stroke-width="1.5"/>
<text x="78" y="380" font-size="16" fill="#67b5ff" font-weight="700" text-anchor="start">1  FORWARD</text>
<text x="170.0" y="408" font-size="23" fill="#f5f8ff" font-weight="700" text-anchor="middle">User / device</text>
<text x="170.0" y="440" font-size="19" fill="#b2c4d9" font-weight="400" text-anchor="middle">Client Connector</text>
<text x="170.0" y="465" font-size="19" fill="#b2c4d9" font-weight="400" text-anchor="middle">or branch forwarding</text>
<rect x="340" y="350" width="250" height="136" rx="16" fill="#10253f" stroke="#29425e" stroke-width="1.5"/>
<text x="358" y="380" font-size="16" fill="#67b5ff" font-weight="700" text-anchor="start">2  INSPECT</text>
<text x="465.0" y="408" font-size="23" fill="#f5f8ff" font-weight="700" text-anchor="middle">ZIA Service Edge</text>
<text x="465.0" y="440" font-size="19" fill="#b2c4d9" font-weight="400" text-anchor="middle">Security inspection</text>
<text x="465.0" y="465" font-size="19" fill="#b2c4d9" font-weight="400" text-anchor="middle">and policy enforcement</text>
<rect x="1010" y="350" width="270" height="136" rx="16" fill="#10253f" stroke="#29425e" stroke-width="1.5"/>
<text x="1028" y="380" font-size="16" fill="#67b5ff" font-weight="700" text-anchor="start">3  INTERNET EGRESS</text>
<text x="1145.0" y="408" font-size="23" fill="#f5f8ff" font-weight="700" text-anchor="middle">Zscaler egress</text>
<text x="1145.0" y="440" font-size="19" fill="#b2c4d9" font-weight="400" text-anchor="middle">Zscaler-owned public IP</text>
<text x="1145.0" y="465" font-size="19" fill="#b2c4d9" font-weight="400" text-anchor="middle">198.51.100.25</text>
<rect x="1610" y="350" width="250" height="136" rx="16" fill="#10253f" stroke="#29425e" stroke-width="1.5"/>
<text x="1628" y="380" font-size="16" fill="#67b5ff" font-weight="700" text-anchor="start">4  DESTINATION</text>
<text x="1735.0" y="408" font-size="23" fill="#f5f8ff" font-weight="700" text-anchor="middle">Internet / SaaS app</text>
<text x="1735.0" y="440" font-size="19" fill="#b2c4d9" font-weight="400" text-anchor="middle">Source-IP allowlist</text>
<text x="1735.0" y="465" font-size="19" fill="#b2c4d9" font-weight="400" text-anchor="middle">203.0.113.10 only</text>
<path d="M280 418 H340" fill="none" stroke="#67b5ff" stroke-width="4" marker-end="url(#blue)"/>
<path d="M590 418 H1010" fill="none" stroke="#67b5ff" stroke-width="4" marker-end="url(#blue)"/>
<path d="M1280 418 H1610" fill="none" stroke="#67b5ff" stroke-width="4" marker-end="url(#blue)"/>
<text x="800" y="398" font-size="18" fill="#67b5ff" font-weight="700" text-anchor="middle">Regular forwarding</text>
<text x="1445" y="398" font-size="18" fill="#67b5ff" font-weight="700" text-anchor="middle">Public internet</text>
<text x="620" y="525" font-size="17" fill="#67b5ff" font-weight="700" text-anchor="start">LIMITATION</text>
<text x="620" y="554" font-size="21" fill="#f5f8ff" font-weight="400" text-anchor="start">The destination sees a Zscaler IP, rather than the corporate IP it expects.</text>
<rect x="1365" y="509" width="495" height="73" rx="10" fill="#142e4d" stroke="#305e89" stroke-width="1.5"/>
<text x="1385" y="537" font-size="20" fill="#67b5ff" font-weight="700" text-anchor="start">DESTINATION SEES  198.51.100.25</text>
<text x="1385" y="564" font-size="19" fill="#b2c4d9" font-weight="400" text-anchor="start">Does not match this org-only IP allowlist</text>
<path d="M60 614 H1860" stroke="#29425e"/>
<text x="60" y="664" font-size="29" fill="#51e2b0" font-weight="700" text-anchor="start">02  SIPA path</text>
<text x="340" y="663" font-size="21" fill="#b2c4d9" font-weight="400" text-anchor="start">Selected traffic keeps ZIA inspection, then uses your chosen egress.</text>
<rect x="985" y="690" width="575" height="230" rx="16" fill="#0e302f" stroke="#2b7164" stroke-width="1.5"/>
<text x="1005" y="716" font-size="16" fill="#51e2b0" font-weight="700" text-anchor="start">YOUR DATA CENTER OR CLOUD VPC / VNET</text>
<rect x="60" y="739" width="220" height="136" rx="16" fill="#10253f" stroke="#29425e" stroke-width="1.5"/>
<text x="78" y="769" font-size="16" fill="#51e2b0" font-weight="700" text-anchor="start">1  FORWARD</text>
<text x="170.0" y="797" font-size="23" fill="#f5f8ff" font-weight="700" text-anchor="middle">User / device</text>
<text x="170.0" y="829" font-size="19" fill="#b2c4d9" font-weight="400" text-anchor="middle">Client Connector</text>
<text x="170.0" y="854" font-size="19" fill="#b2c4d9" font-weight="400" text-anchor="middle">or branch forwarding</text>
<rect x="340" y="739" width="250" height="136" rx="16" fill="#10253f" stroke="#29425e" stroke-width="1.5"/>
<text x="358" y="769" font-size="16" fill="#51e2b0" font-weight="700" text-anchor="start">2  INSPECT + SELECT</text>
<text x="465.0" y="797" font-size="23" fill="#f5f8ff" font-weight="700" text-anchor="middle">ZIA Service Edge</text>
<text x="465.0" y="829" font-size="19" fill="#b2c4d9" font-weight="400" text-anchor="middle">Inspect traffic</text>
<text x="465.0" y="854" font-size="19" fill="#b2c4d9" font-weight="400" text-anchor="middle">Match SIPA forwarding rule</text>
<rect x="650" y="739" width="280" height="136" rx="16" fill="#10253f" stroke="#29425e" stroke-width="1.5"/>
<text x="668" y="769" font-size="16" fill="#51e2b0" font-weight="700" text-anchor="start">3  FORWARD VIA ZPA</text>
<text x="790.0" y="797" font-size="23" fill="#f5f8ff" font-weight="700" text-anchor="middle">ZPA service fabric</text>
<text x="790.0" y="829" font-size="19" fill="#b2c4d9" font-weight="400" text-anchor="middle">Brokered delivery</text>
<text x="790.0" y="854" font-size="19" fill="#b2c4d9" font-weight="400" text-anchor="middle">to selected App Connectors</text>
<rect x="1010" y="739" width="240" height="136" rx="16" fill="#10253f" stroke="#29425e" stroke-width="1.5"/>
<text x="1028" y="769" font-size="16" fill="#51e2b0" font-weight="700" text-anchor="start">4  CONNECT</text>
<text x="1130.0" y="797" font-size="23" fill="#f5f8ff" font-weight="700" text-anchor="middle">App Connector</text>
<text x="1130.0" y="829" font-size="19" fill="#b2c4d9" font-weight="400" text-anchor="middle">Customer-deployed</text>
<text x="1130.0" y="854" font-size="19" fill="#b2c4d9" font-weight="400" text-anchor="middle">Private IP: 10.0.0.3</text>
<rect x="1305" y="739" width="230" height="136" rx="16" fill="#10253f" stroke="#29425e" stroke-width="1.5"/>
<text x="1323" y="769" font-size="16" fill="#51e2b0" font-weight="700" text-anchor="start">5  SOURCE NAT</text>
<text x="1420.0" y="797" font-size="23" fill="#f5f8ff" font-weight="700" text-anchor="middle">Your NAT egress</text>
<text x="1420.0" y="829" font-size="19" fill="#b2c4d9" font-weight="400" text-anchor="middle">Firewall / NAT gateway</text>
<text x="1420.0" y="854" font-size="19" fill="#b2c4d9" font-weight="400" text-anchor="middle">Public IP: 203.0.113.10</text>
<rect x="1610" y="739" width="250" height="136" rx="16" fill="#10253f" stroke="#29425e" stroke-width="1.5"/>
<text x="1628" y="769" font-size="16" fill="#51e2b0" font-weight="700" text-anchor="start">6  DESTINATION</text>
<text x="1735.0" y="797" font-size="23" fill="#f5f8ff" font-weight="700" text-anchor="middle">Internet / SaaS app</text>
<text x="1735.0" y="829" font-size="19" fill="#b2c4d9" font-weight="400" text-anchor="middle">Source-IP allowlist</text>
<text x="1735.0" y="854" font-size="19" fill="#b2c4d9" font-weight="400" text-anchor="middle">203.0.113.10 only</text>
<path d="M280 807 H340" fill="none" stroke="#51e2b0" stroke-width="4" marker-end="url(#green)"/>
<path d="M590 807 H650" fill="none" stroke="#51e2b0" stroke-width="4" marker-end="url(#green)"/>
<path d="M930 807 H1010" fill="none" stroke="#51e2b0" stroke-width="4" marker-end="url(#green)"/>
<path d="M1250 807 H1305" fill="none" stroke="#51e2b0" stroke-width="4" marker-end="url(#green)"/>
<path d="M1535 807 H1610" fill="none" stroke="#51e2b0" stroke-width="4" marker-end="url(#green)"/>
<text x="340" y="909" font-size="18" fill="#b2c4d9" font-weight="400" text-anchor="start">ZIA rule selects the SIPA application</text>
<text x="340" y="934" font-size="18" fill="#b2c4d9" font-weight="400" text-anchor="start">segment and configured ZPA gateway.</text>
<rect x="1365" y="939" width="495" height="73" rx="10" fill="#11372f" stroke="#337f6a" stroke-width="1.5"/>
<text x="1385" y="967" font-size="20" fill="#51e2b0" font-weight="700" text-anchor="start">DESTINATION SEES  203.0.113.10</text>
<text x="1385" y="994" font-size="19" fill="#b2c4d9" font-weight="400" text-anchor="start">Matches the configured IP allowlist</text>
<text x="60" y="988" font-size="22" fill="#f5f8ff" font-weight="700" text-anchor="start">Only policy-selected traffic takes the SIPA path. Other traffic continues on the regular ZIA path.</text>
<path d="M60 1040 H1860" stroke="#29425e"/>
<text x="60" y="1074" font-size="16" fill="#51e2b0" font-weight="700" text-anchor="start">HOW TO READ THIS DIAGRAM</text>
<text x="60" y="1103" font-size="20" fill="#b2c4d9" font-weight="400" text-anchor="start">Arrows show the logical request path; responses return through the established connections. This is the external / internet destination use case.</text>
<text x="60" y="1133" font-size="20" fill="#b2c4d9" font-weight="400" text-anchor="start">“Your choice” means a public IP configured on your actual egress. SIPA does not preserve the endpoint’s private IP or spoof an arbitrary address.</text>
<text x="60" y="1163" font-size="19" fill="#b2c4d9" font-weight="400" text-anchor="start">Illustrative IPs only. An IP allowlist match satisfies that check; application authentication and other access policies still apply.</text>
</g></svg>