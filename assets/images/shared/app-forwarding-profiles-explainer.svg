<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1060" viewBox="0 0 1600 1060" role="img" aria-labelledby="title desc"><title id="title">Zscaler Client Connector: App Profile versus Forwarding Profile</title><desc id="desc">An App Profile assigns endpoint settings to users and references a Forwarding Profile. The Forwarding Profile controls ZIA and ZPA traffic handling by network context. For ZIA, Z-Tunnel 1.0 uses CONNECT for web or proxy-aware traffic, while Z-Tunnel 2.0 uses DTLS or TLS for packets across all ports and protocols, subject to policy and bypasses.</desc><defs>
<marker id="arr" viewBox="0 0 12 12" refX="12" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#51e2b0"/></marker></defs>
<rect width="1600" height="1060" fill="#07182e"/><g font-family="Arial, Helvetica, sans-serif">
<text x="60" y="52" font-size="17" fill="#51e2b0" font-weight="700" text-anchor="start">ZSCALER CLIENT CONNECTOR  /  LEARNER QUICK GUIDE</text>
<text x="60" y="108" font-size="43" fill="#f5f8ff" font-weight="700" text-anchor="start">App Profile + Forwarding Profile</text>
<text x="60" y="149" font-size="23" fill="#b2c4d9" font-weight="400" text-anchor="start">One configures the endpoint experience. The other defines network-dependent forwarding.</text>
<rect x="60" y="194" width="670" height="700" rx="16" fill="#10253f" stroke="#29425e" stroke-width="1.5"/>
<rect x="870" y="194" width="670" height="700" rx="16" fill="#10253f" stroke="#29425e" stroke-width="1.5"/>
<text x="90" y="231" font-size="17" fill="#67b5ff" font-weight="700" text-anchor="start">ENDPOINT CONFIGURATION</text>
<text x="90" y="278" font-size="36" fill="#f5f8ff" font-weight="700" text-anchor="start">App Profile</text>
<text x="90" y="316" font-size="22" fill="#b2c4d9" font-weight="400" text-anchor="start">What settings should this user’s Client Connector use?</text>
<rect x="90" y="345" width="610" height="76" rx="12" fill="#173450" stroke="#396284" stroke-width="1.5"/>
<text x="110" y="374" font-size="15" fill="#67b5ff" font-weight="700" text-anchor="start">FORWARDING PROFILE</text>
<text x="110" y="402" font-size="24" fill="#f5f8ff" font-weight="700" text-anchor="start">Selected profile: Corporate-Forwarding</text>
<path d="M730 383 H870" fill="none" stroke="#51e2b0" stroke-width="3" marker-end="url(#arr)"/>
<text x="800" y="365" font-size="17" fill="#51e2b0" font-weight="700" text-anchor="middle">references</text>
<text x="900" y="231" font-size="17" fill="#51e2b0" font-weight="700" text-anchor="start">TRAFFIC HANDLING</text>
<text x="900" y="278" font-size="36" fill="#f5f8ff" font-weight="700" text-anchor="start">Forwarding Profile</text>
<text x="900" y="316" font-size="22" fill="#b2c4d9" font-weight="400" text-anchor="start">How should traffic flow on this network?</text>
<text x="90" y="465" font-size="17" fill="#67b5ff" font-weight="700" text-anchor="start">01</text>
<text x="90" y="499" font-size="25" fill="#f5f8ff" font-weight="700" text-anchor="start">Assignment</text>
<text x="90" y="534" font-size="20" fill="#b2c4d9" font-weight="400" text-anchor="start">OS-specific rules</text>
<text x="90" y="564" font-size="20" fill="#b2c4d9" font-weight="400" text-anchor="start">User / group scope</text>
<text x="90" y="590" font-size="20" fill="#b2c4d9" font-weight="400" text-anchor="start">+ rule precedence</text>
<text x="410" y="465" font-size="17" fill="#67b5ff" font-weight="700" text-anchor="start">02</text>
<text x="410" y="499" font-size="25" fill="#f5f8ff" font-weight="700" text-anchor="start">Traffic steering</text>
<text x="410" y="534" font-size="20" fill="#b2c4d9" font-weight="400" text-anchor="start">PAC configuration</text>
<text x="410" y="564" font-size="20" fill="#b2c4d9" font-weight="400" text-anchor="start">IP / application bypasses</text>
<text x="90" y="638" font-size="17" fill="#67b5ff" font-weight="700" text-anchor="start">03</text>
<text x="90" y="672" font-size="25" fill="#f5f8ff" font-weight="700" text-anchor="start">Endpoint controls</text>
<text x="90" y="707" font-size="20" fill="#b2c4d9" font-weight="400" text-anchor="start">Certificate installation</text>
<text x="90" y="737" font-size="20" fill="#b2c4d9" font-weight="400" text-anchor="start">Logout / disable / uninstall</text>
<text x="90" y="763" font-size="20" fill="#b2c4d9" font-weight="400" text-anchor="start">passwords</text>
<text x="410" y="638" font-size="17" fill="#67b5ff" font-weight="700" text-anchor="start">04</text>
<text x="410" y="672" font-size="25" fill="#f5f8ff" font-weight="700" text-anchor="start">Operations</text>
<text x="410" y="707" font-size="20" fill="#b2c4d9" font-weight="400" text-anchor="start">Logging settings</text>
<text x="410" y="737" font-size="20" fill="#b2c4d9" font-weight="400" text-anchor="start">ZIA posture profile selection</text>
<text x="90" y="853" font-size="20" fill="#67b5ff" font-weight="700" text-anchor="start">App means the Client Connector application.</text>
<rect x="900" y="345" width="290" height="39" rx="8" fill="#133332" stroke="#2c665d" stroke-width="1.5"/>
<text x="1045.0" y="371" font-size="19" fill="#51e2b0" font-weight="700" text-anchor="middle">On-Trusted</text>
<rect x="1210" y="345" width="300" height="39" rx="8" fill="#133332" stroke="#2c665d" stroke-width="1.5"/>
<text x="1360.0" y="371" font-size="19" fill="#51e2b0" font-weight="700" text-anchor="middle">Off-Trusted</text>
<rect x="900" y="394" width="290" height="39" rx="8" fill="#133332" stroke="#2c665d" stroke-width="1.5"/>
<text x="1045.0" y="420" font-size="19" fill="#51e2b0" font-weight="700" text-anchor="middle">VPN-Trusted</text>
<rect x="1210" y="394" width="300" height="39" rx="8" fill="#133332" stroke="#2c665d" stroke-width="1.5"/>
<text x="1360.0" y="420" font-size="19" fill="#51e2b0" font-weight="700" text-anchor="middle">Split VPN-Trusted</text>
<path d="M1205 433 V463" fill="none" stroke="#51e2b0" stroke-width="3" marker-end="url(#arr)"/>
<rect x="900" y="463" width="610" height="72" rx="10" fill="#133332" stroke="#2c665d" stroke-width="1.5"/>
<text x="1205" y="490" font-size="22" fill="#f5f8ff" font-weight="700" text-anchor="middle">ZIA forwarding mode + ZPA Tunnel / None*</text>
<text x="1205" y="517" font-size="19" fill="#b2c4d9" font-weight="400" text-anchor="middle">ZIA examples: Tunnel, local proxy, None</text>
<text x="900" y="579" font-size="17" fill="#51e2b0" font-weight="700" text-anchor="start">ZIA TUNNEL VERSION</text>
<rect x="900" y="598" width="290" height="200" rx="16" fill="#0b2039" stroke="#29425e" stroke-width="1.5"/>
<rect x="1210" y="598" width="300" height="200" rx="16" fill="#0b2928" stroke="#29425e" stroke-width="1.5"/>
<text x="920" y="632" font-size="25" fill="#f5f8ff" font-weight="700" text-anchor="start">Z-Tunnel 1.0</text>
<text x="920" y="668" font-size="19" fill="#b2c4d9" font-weight="400" text-anchor="start">CONNECT-based forwarding</text>
<text x="920" y="703" font-size="20" fill="#f5f8ff" font-weight="400" text-anchor="start">Proxy-aware or 80/443</text>
<text x="920" y="730" font-size="20" fill="#f5f8ff" font-weight="400" text-anchor="start">traffic, depending on mode</text>
<text x="1230" y="632" font-size="25" fill="#f5f8ff" font-weight="700" text-anchor="start">Z-Tunnel 2.0</text>
<text x="1230" y="668" font-size="19" fill="#b2c4d9" font-weight="400" text-anchor="start">Packet tunnel over DTLS / TLS</text>
<text x="1230" y="703" font-size="20" fill="#f5f8ff" font-weight="400" text-anchor="start">All ports and protocols</text>
<text x="1230" y="730" font-size="19" fill="#b2c4d9" font-weight="400" text-anchor="start">Subject to policy + bypasses</text>
<text x="900" y="830" font-size="19" fill="#b2c4d9" font-weight="400" text-anchor="start">Also sets transport and tunnel-failure / fallback behavior.</text>
<text x="900" y="863" font-size="20" fill="#51e2b0" font-weight="700" text-anchor="start">Z-Tunnel versions apply to ZIA, not ZPA.</text>
<rect x="60" y="925" width="1480" height="64" rx="16" fill="#152d45" stroke="#29425e" stroke-width="1.5"/>
<text x="800" y="965" font-size="27" fill="#f5f8ff" font-weight="700" text-anchor="middle">App Profile = endpoint settings + a reference to the Forwarding Profile</text>
<text x="60" y="1022" font-size="18" fill="#b2c4d9" font-weight="400" text-anchor="start">*Available modes and settings vary by OS, Client Connector version and service. Trusted-network criteria determine the network context.</text>
</g></svg>